name: Fix production dependency lock

on:
  push:
    branches: [agent/manual-time-delivery-notes-v1]

permissions:
  contents: write

jobs:
  fix-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/manual-time-delivery-notes-v1
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply npm's minimal production audit fix to the lockfile
        run: npm audit fix --package-lock-only --omit=dev
      - name: Verify the production audit is clean
        run: npm audit --omit=dev --audit-level=high
      - name: Commit only the generated lockfile change
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile change was required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: patch vulnerable production dependency lock"
          git push origin HEAD:agent/manual-time-delivery-notes-v1
