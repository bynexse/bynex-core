name: Repair HQ release migration stamp and wording

on:
  push:
    branches:
      - agent/hq-team-customer-staff-smartprice-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hq-team-customer-staff-smartprice-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Repair duplicate migration timestamp and clarify pricing copy
        run: |
          python - <<'PY'
          from collections import defaultdict
          from pathlib import Path

          panel_path = Path("components/platform-admin/hq/HqCustomerMembersPanel.tsx")
          panel = panel_path.read_text()
          replacements = {
              'if (selectedRate <= 0) return { label: "Företagets pris saknas", tone: "warning" as const };':
                  'if (selectedRate <= 0) return { label: "Företaget har inte valt pris", tone: "warning" as const };',
              'if (selectedRate < recommendedRate) return { label: "Under Bynex riktvärde", tone: "warning" as const };':
                  'if (selectedRate < recommendedRate) return { label: "Valt pris ger lägre marginal än målet", tone: "warning" as const };',
              'return { label: "Över Bynex riktvärde", tone: "good" as const };':
                  'return { label: "Valt pris når målmarginalen", tone: "good" as const };',
              'Bynex rekommenderar minst': 'Bynex riktpris för vald marginal',
              '<p className="text-xs text-zinc-500">Företagets val</p>':
                  '<p className="text-xs text-zinc-500">Företaget tar</p>',
              'Direkt kostnad: {sek.format(asNumber(member.direct_cost_per_hour))}/h':
                  'Kostar företaget: {sek.format(asNumber(member.direct_cost_per_hour))}/h',
          }
          for old, new in replacements.items():
              if old in panel:
                  panel = panel.replace(old, new)
          panel_path.write_text(panel)

          migrations = sorted(Path("supabase/migrations").glob("*.sql"))
          groups = defaultdict(list)
          for migration in migrations:
              groups[migration.name[:14]].append(migration)

          release_names = {
              "20260806171000_platform_team_customer_members_smart_price.sql",
              "20260806171100_platform_customer_labor_profitability.sql",
              "20260806171200_platform_customer_flat_hourly_rate.sql",
              "20260806171300_platform_customer_selected_hourly_rate.sql",
              "20260806171400_platform_team_invitations.sql",
              "20260806171500_organization_labor_pricing_self_service.sql",
          }
          used = set(groups)
          repaired = []
          for stamp, duplicates in sorted(groups.items()):
              if len(duplicates) < 2:
                  continue
              candidates = [item for item in duplicates if item.name in release_names]
              if not candidates:
                  raise SystemExit(
                      "Duplicate migration stamp has no HQ release candidate: "
                      + ", ".join(item.name for item in duplicates)
                  )
              keep = duplicates[0]
              for target in candidates:
                  if target == keep and len(candidates) == 1:
                      other = next((item for item in duplicates if item != target), None)
                      if other is not None and other.name not in release_names:
                          pass
                      else:
                          continue
                  next_stamp = int(stamp) + 1
                  while f"{next_stamp:014d}" in used:
                      next_stamp += 1
                  new_stamp = f"{next_stamp:014d}"
                  new_path = target.with_name(new_stamp + target.name[14:])
                  target.rename(new_path)
                  used.add(new_stamp)
                  repaired.append((target.name, new_path.name))
                  break

          remaining = defaultdict(list)
          for migration in Path("supabase/migrations").glob("*.sql"):
              remaining[migration.name[:14]].append(migration.name)
          duplicates_left = {
              stamp: names for stamp, names in remaining.items() if len(names) > 1
          }
          if duplicates_left:
              raise SystemExit(f"Migration timestamps still duplicated: {duplicates_left}")
          print("Migration repairs:", repaired)

          for workflow_name in (
              ".github/workflows/patch-hourly-rate-copy-once.yml",
              ".github/workflows/fix-hq-release-once.yml",
          ):
              workflow = Path(workflow_name)
              if workflow.exists():
                  workflow.unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate migration history
        run: npm run test:migrations

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit repaired release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep customer hourly pricing advisory and migration-safe"
          git push origin HEAD:agent/hq-team-customer-staff-smartprice-v1
