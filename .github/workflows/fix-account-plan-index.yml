name: Fix account plan index

on:
  push:
    branches: [agent/versioned-searchable-chart-of-accounts]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/versioned-searchable-chart-of-accounts
      - name: Make account plan search indexes immutable
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("supabase/migrations/20260807215500_versioned_searchable_account_plan.sql")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "using gin (to_tsvector('simple',search_text));",
              "using gin (to_tsvector('simple'::regconfig,search_text));",
              1,
          )

          old = """create index if not exists ledger_accounts_search_idx
  on public.ledger_accounts
  using gin (
    to_tsvector(
      'simple',
      account_number || ' ' || name || ' '
      || array_to_string(search_aliases,' ')
    )
  );
"""
          new = """create index if not exists ledger_accounts_search_idx
  on public.ledger_accounts
  using gin (
    to_tsvector(
      'simple'::regconfig,
      account_number || ' ' || name
    )
  );
create index if not exists ledger_accounts_search_aliases_idx
  on public.ledger_accounts using gin (search_aliases);
"""
          if old not in text:
              raise SystemExit("ledger account search index block did not match")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/fix-account-plan-index.yml
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260807215500_versioned_searchable_account_plan.sql .github/workflows/fix-account-plan-index.yml
          git commit -m "fix: use immutable account plan search indexes"
          git push origin HEAD:agent/versioned-searchable-chart-of-accounts
