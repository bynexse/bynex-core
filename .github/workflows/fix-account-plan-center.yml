name: Fix account plan center

on:
  push:
    branches: [agent/versioned-searchable-chart-of-accounts]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/versioned-searchable-chart-of-accounts
      - name: Fix activation callback type
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("components/modules/bookkeeping/AccountPlanCenter.tsx")
          text = path.read_text(encoding="utf-8")
          old = "  onActivate: () => void | undefined;"
          new = "  onActivate: () => void | Promise<void> | undefined;"
          if old not in text:
            raise SystemExit("activation callback type did not match")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/fix-account-plan-center.yml
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/modules/bookkeeping/AccountPlanCenter.tsx .github/workflows/fix-account-plan-center.yml
          git commit -m "fix: type account plan activation callback"
          git push origin HEAD:agent/versioned-searchable-chart-of-accounts
