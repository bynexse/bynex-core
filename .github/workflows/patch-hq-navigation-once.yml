name: Patch HQ workspace once

on:
  push:
    branches:
      - agent/hq-team-customer-staff-smartprice-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hq-team-customer-staff-smartprice-v1
      - name: Integrate customer staff, Bynex team and standalone Smart Price
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/platform-admin/PlatformHqWorkspaceV3.tsx')
          text = path.read_text(encoding='utf-8')

          replacements = [
            (
              'import HqCustomerWorkspace from "./hq/HqCustomerWorkspace";\nimport HqPricingContractsWorkspace from "./hq/HqPricingContractsWorkspace";',
              'import HqCustomerWorkspace from "./hq/HqCustomerWorkspaceV2";\nimport HqInternalTeamWorkspace from "./hq/HqInternalTeamWorkspace";\nimport HqPricingContractsWorkspace from "./hq/HqPricingContractsWorkspace";\nimport HqSmartPriceWorkspace from "./hq/HqSmartPriceWorkspace";'
            ),
            (
              '    description: "Prisförslag i exakta kronor",\n    icon: Sparkles,\n    customerRequired: true,',
              '    description: "Internt pris- och marginalverktyg",\n    icon: Sparkles,'
            ),
            (
              '''            {(activeTab === "pricing" || activeTab === "contracts") && (\n              <HqPricingContractsWorkspace\n                mode={activeTab}\n                data={data}\n                selectedOrganizationId={selectedOrganizationId}\n                runAction={runAction}\n                busy={busy}\n              />\n            )}''',
              '''            {activeTab === "pricing" && (\n              <HqSmartPriceWorkspace\n                data={data}\n                selectedOrganizationId={selectedOrganizationId}\n                runAction={runAction}\n                busy={busy}\n              />\n            )}\n            {activeTab === "contracts" && (\n              <HqPricingContractsWorkspace\n                mode="contracts"\n                data={data}\n                selectedOrganizationId={selectedOrganizationId}\n                runAction={runAction}\n                busy={busy}\n              />\n            )}'''
            ),
            (
              '''            {(activeTab === "catalog" || activeTab === "staff" || activeTab === "audit") && (\n              <HqSystemWorkspace mode={activeTab} data={data} runAction={runAction} busy={busy} />\n            )}''',
              '''            {activeTab === "staff" && <HqInternalTeamWorkspace />}\n            {(activeTab === "catalog" || activeTab === "audit") && (\n              <HqSystemWorkspace mode={activeTab} data={data} runAction={runAction} busy={busy} />\n            )}'''
            ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected HQ fragment not found: {old[:90]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/platform-admin/PlatformHqWorkspaceV3.tsx
          git commit -m "feat: separate Bynex team, customer staff and Smart Price"
          git push origin HEAD:agent/hq-team-customer-staff-smartprice-v1
