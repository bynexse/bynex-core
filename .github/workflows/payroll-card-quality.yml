name: Payroll card quality

on:
  push:
    branches:
      - agent/payroll-card-controls-v1
  pull_request:
    paths:
      - "app/api/private/people/payroll-card/**"
      - "components/modules/people/**"
      - "supabase/migrations/**"
      - "tsconfig.json"
      - ".github/workflows/payroll-card-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
