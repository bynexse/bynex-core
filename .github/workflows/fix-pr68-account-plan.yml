name: Fix PR68 account plan callback

on:
  pull_request_target:
    branches: [main]
    types: [ready_for_review, reopened]

permissions:
  contents: write

jobs:
  fix:
    # Strictly limited to Bynex's own PR 68 and its exact internal branch.
    if: github.event.pull_request.number == 68 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/versioned-searchable-chart-of-accounts'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact internal feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/versioned-searchable-chart-of-accounts
      - name: Patch the callback without changing behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("components/modules/bookkeeping/AccountPlanCenter.tsx")
          text = path.read_text(encoding="utf-8")
          old = '''                  onActivate={() =>
                    result.catalog_account_id
                      ? postAction(
                          {
                            action: "activate_account",
                            catalogAccountId: result.catalog_account_id,
                          },
                          `activate:${result.catalog_account_id}`,
                          `Konto ${result.account_number} är aktiverat`,
                        )
                      : undefined
                  }
'''
          new = '''                  onActivate={() => {
                    if (!result.catalog_account_id) return;
                    void postAction(
                      {
                        action: "activate_account",
                        catalogAccountId: result.catalog_account_id,
                      },
                      `activate:${result.catalog_account_id}`,
                      `Konto ${result.account_number} är aktiverat`,
                    );
                  }}
'''
          if old in text:
            path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
            raise SystemExit("activation callback block did not match")
          PY
      - name: Commit the isolated source fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/modules/bookkeeping/AccountPlanCenter.tsx
          git commit -m "fix: make account activation callback explicitly void"
          git push origin HEAD:agent/versioned-searchable-chart-of-accounts
