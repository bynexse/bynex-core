name: Apply SIE review-flow fix

on:
  push:
    branches:
      - fix/sie-import-review-flow

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[sie-review-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sie-import-review-flow
          fetch-depth: 0

      - name: Patch SIE review and bookkeeping refresh flow
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          panel_path = Path('components/modules/accounting/SieTransferPanel.tsx')
          panel = panel_path.read_text()

          panel = panel.replace(
              'import { type FormEvent, useState } from "react";',
              'import { type FormEvent, useRef, useState } from "react";',
          )

          old_props = '''export default function SieTransferPanel({
            notify,
          }: {
            notify: (message: string) => void;
          }) {'''
          new_props = '''export default function SieTransferPanel({
            notify,
            onImportCompleted,
            onOpenImportedVouchers,
          }: {
            notify: (message: string) => void;
            onImportCompleted?: (result: ImportResult) => void | Promise<void>;
            onOpenImportedVouchers?: (fiscalYearId?: string) => void | Promise<void>;
          }) {'''
          if old_props not in panel:
              raise SystemExit('SieTransferPanel props marker not found')
          panel = panel.replace(old_props, new_props, 1)

          busy_marker = '  const [busy, setBusy] = useState<BusyState>(null);\n'
          if busy_marker not in panel:
              raise SystemExit('busy state marker not found')
          panel = panel.replace(
              busy_marker,
              busy_marker + '  const reviewDecisionRef = useRef<HTMLDivElement | null>(null);\n',
              1,
          )

          new_send_file = '''  async function sendFile(intent: "preview" | "approve") {
            if (!file) {
              setError("Välj en SIE-fil först.");
              return;
            }
            if (intent === "approve" && !result?.review.checksumSha256) {
              setError("Kontrollera filen innan den godkänns.");
              return;
            }

            setBusy(intent);
            setError(null);
            try {
              const body = new FormData();
              body.set("file", file, file.name);
              body.set("intent", intent);
              if (intent === "approve" && result) {
                body.set("expectedChecksum", result.review.checksumSha256);
              }

              const response = await fetch("/api/private/accounting/sie", {
                method: "POST",
                body,
              });
              const payload = (await response.json().catch(() => null)) as
                | (Result & { error?: string })
                | { error?: string; review?: Review }
                | null;

              if (!response.ok) {
                if (payload && "review" in payload && payload.review && result) {
                  setResult({ ...result, review: payload.review });
                }
                setError(payload?.error ?? "SIE-filen kunde inte behandlas.");
                return;
              }

              const next = payload as Result;
              setResult(next);
              if (intent === "approve" && next.import) {
                notify(
                  next.import.alreadyImported
                    ? "SIE-filen var redan importerad – ingen dubbelbokföring gjordes"
                    : `${integer.format(next.import.importedVouchers)} SIE-verifikationer är bokförda`,
                );
                await onImportCompleted?.(next.import);
              } else {
                notify(
                  next.review.canApprove
                    ? "SIE-filen är kontrollerad och klar för godkännande"
                    : "SIE-filen är kontrollerad och visar vad som måste lösas",
                );
                window.requestAnimationFrame(() => {
                  reviewDecisionRef.current?.scrollIntoView({
                    behavior: "smooth",
                    block: "center",
                  });
                });
              }
            } catch (caught) {
              setError(
                caught instanceof Error
                  ? caught.message
                  : "SIE-filen kunde inte behandlas.",
              );
            } finally {
              setBusy(null);
            }
          }
'''
          panel, replacements = re.subn(
              r'  async function sendFile\(intent: "preview" \| "approve"\) \{.*?\n  \}\n\n(?=  async function preview)',
              new_send_file + '\n',
              panel,
              count=1,
              flags=re.S,
          )
          if replacements != 1:
              raise SystemExit(f'sendFile replacement count was {replacements}')

          summary_marker = '''          <div className="grid gap-px bg-zinc-100 sm:grid-cols-4">
            <Summary label="Konton som används" value={result.review.accounts.used} />
            <Summary label="Matchade konton" value={result.review.accounts.matched} />
            <Summary label="Nya konton" value={result.review.accounts.willBeCreated.length} />
            <Summary label="Verifikationer" value={result.preview.voucherCount} />
          </div>
'''
          decision_panel = '''
          {!result.import && (
            <div
              ref={reviewDecisionRef}
              aria-live="polite"
              className={`m-6 rounded-2xl border p-5 ${
                result.review.canApprove
                  ? "border-emerald-200 bg-emerald-50"
                  : result.review.blockers.length > 0
                    ? "border-red-200 bg-red-50"
                    : "border-zinc-200 bg-zinc-50"
              }`}
            >
              {result.review.canApprove ? (
                <div className="flex flex-col justify-between gap-4 lg:flex-row lg:items-center">
                  <div className="flex items-start gap-3">
                    <ShieldCheck className="mt-0.5 h-6 w-6 shrink-0 text-emerald-800" />
                    <div>
                      <p className="text-xs font-bold uppercase tracking-[0.16em] text-emerald-700">
                        Steg 2 av 2
                      </p>
                      <h4 className="mt-1 text-lg font-semibold text-emerald-950">
                        Filen är klar – godkänn för att föra in den i bokföringen
                      </h4>
                      <p className="mt-2 max-w-3xl text-sm leading-6 text-emerald-900">
                        Ett klick sparar originalet privat, matchar eller skapar konton och
                        bokför samtliga balanserade verifikationer i en odelbar transaktion.
                      </p>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => void sendFile("approve")}
                    disabled={Boolean(busy)}
                    className="inline-flex shrink-0 items-center justify-center gap-2 rounded-xl bg-[#202522] px-6 py-4 text-sm font-semibold text-white shadow-md disabled:opacity-50"
                  >
                    {busy === "approve" ? (
                      <Loader2 className="h-4 w-4 animate-spin" />
                    ) : (
                      <LockKeyhole className="h-4 w-4 text-emerald-300" />
                    )}
                    {busy === "approve"
                      ? "Importerar säkert…"
                      : `Godkänn och importera ${integer.format(result.preview.voucherCount)}`}
                  </button>
                </div>
              ) : result.review.blockers.length > 0 ? (
                <div className="flex flex-col justify-between gap-4 lg:flex-row lg:items-center">
                  <div className="flex items-start gap-3">
                    <XCircle className="mt-0.5 h-6 w-6 shrink-0 text-red-700" />
                    <div>
                      <p className="text-xs font-bold uppercase tracking-[0.16em] text-red-700">
                        Importen är stoppad säkert
                      </p>
                      <h4 className="mt-1 text-lg font-semibold text-red-950">
                        {result.review.blockers.length} punkt
                        {result.review.blockers.length === 1 ? "" : "er"} måste lösas
                      </h4>
                      <p className="mt-2 text-sm leading-6 text-red-900">
                        {result.review.blockers[0]}
                      </p>
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() =>
                      document.getElementById("sie-import-blockers")?.scrollIntoView({
                        behavior: "smooth",
                        block: "center",
                      })
                    }
                    className="inline-flex shrink-0 items-center justify-center gap-2 rounded-xl border border-red-300 bg-white px-5 py-3 text-sm font-semibold text-red-900"
                  >
                    <AlertTriangle className="h-4 w-4" /> Visa alla stopp
                  </button>
                </div>
              ) : (
                <div className="flex items-start gap-3">
                  <CheckCircle2 className="mt-0.5 h-6 w-6 shrink-0 text-zinc-700" />
                  <div>
                    <h4 className="font-semibold text-zinc-950">Filen är redan behandlad</h4>
                    <p className="mt-2 text-sm leading-6 text-zinc-700">
                      Bynex har stoppat en ny import för att undvika dubbelbokföring.
                    </p>
                  </div>
                </div>
              )}
            </div>
          )}
'''
          if summary_marker not in panel:
              raise SystemExit('summary marker not found')
          panel = panel.replace(summary_marker, summary_marker + decision_panel, 1)

          blocker_marker = '''          {!result.import && result.review.blockers.length > 0 && (
            <div className="m-6 space-y-2 rounded-2xl border border-red-200 bg-red-50 p-4">'''
          blocker_replacement = '''          {!result.import && result.review.blockers.length > 0 && (
            <div
              id="sie-import-blockers"
              className="m-6 space-y-2 rounded-2xl border border-red-200 bg-red-50 p-4"
            >'''
          if blocker_marker not in panel:
              raise SystemExit('blocker marker not found')
          panel = panel.replace(blocker_marker, blocker_replacement, 1)

          success_followup_marker = '''          {!result.import && result.review.blockers.length > 0 && ('''
          success_followup = '''          {result.import && onOpenImportedVouchers && (
            <div className="mx-6 -mt-2 mb-6">
              <button
                type="button"
                onClick={() =>
                  void onOpenImportedVouchers(result.import?.fiscalYearId)
                }
                className="inline-flex items-center justify-center gap-2 rounded-xl bg-[#202522] px-5 py-3 text-sm font-semibold text-white"
              >
                <FileCheck2 className="h-4 w-4 text-emerald-300" />
                Visa importerade verifikationer
              </button>
            </div>
          )}

'''
          if success_followup_marker not in panel:
              raise SystemExit('success follow-up marker not found')
          panel = panel.replace(success_followup_marker, success_followup + success_followup_marker, 1)

          panel_path.write_text(panel)

          live_path = Path('components/modules/bookkeeping/LiveBookkeepingModule.tsx')
          live = live_path.read_text()
          old_live = '{tab === "sie" && <SieTransferPanel notify={notify} />}'
          new_live = '''{tab === "sie" && (
      <SieTransferPanel
        notify={notify}
        onImportCompleted={async (imported) => {
          await load(imported.fiscalYearId);
        }}
        onOpenImportedVouchers={async (fiscalYearId) => {
          await load(fiscalYearId);
          setTab("vouchers");
        }}
      />
    )}'''
          if old_live not in live:
              raise SystemExit('LiveBookkeepingModule SIE marker not found')
          live_path.write_text(live.replace(old_live, new_live, 1))

          test_path = Path('tests/accounting/sie-import-approval.test.mjs')
          tests = test_path.read_text()
          panel_read_marker = '''const panel = readFileSync(
  new URL("components/modules/accounting/SieTransferPanel.tsx", root),
  "utf8",
);
'''
          live_read = '''const liveBookkeeping = readFileSync(
  new URL("components/modules/bookkeeping/LiveBookkeepingModule.tsx", root),
  "utf8",
);
'''
          if panel_read_marker not in tests:
              raise SystemExit('test panel read marker not found')
          tests = tests.replace(panel_read_marker, panel_read_marker + live_read, 1)
          tests += '''

test("SIE-granskningen leder direkt vidare och uppdaterar bokföringsvyn", () => {
  assert.match(panel, /Steg 2 av 2/);
  assert.match(panel, /Filen är klar – godkänn för att föra in den i bokföringen/);
  assert.match(panel, /ref=\{reviewDecisionRef\}/);
  assert.match(panel, /Visa importerade verifikationer/);
  assert.match(panel, /finally\s*\{\s*setBusy\(null\)/);
  assert.ok(
    panel.indexOf("Steg 2 av 2") < panel.indexOf("Första verifikationerna"),
    "godkännandebeslutet ska visas före den långa verifikationslistan",
  );
  assert.match(liveBookkeeping, /onImportCompleted/);
  assert.match(liveBookkeeping, /await load\(imported\.fiscalYearId\)/);
  assert.match(liveBookkeeping, /onOpenImportedVouchers/);
  assert.match(liveBookkeeping, /setTab\("vouchers"\)/);
});
'''
          test_path.write_text(tests)
          PY

      - name: Run focused checks
        run: |
          npm ci
          npm run test:sie
          npm run typecheck

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Bynex Automation"
          git config user.email "automation@bynex.se"
          git add components/modules/accounting/SieTransferPanel.tsx \
                  components/modules/bookkeeping/LiveBookkeepingModule.tsx \
                  tests/accounting/sie-import-approval.test.mjs
          git commit -m "fix: make SIE approval unmistakable and refresh vouchers [sie-review-fix-applied]"
          git push origin HEAD:fix/sie-import-review-flow
