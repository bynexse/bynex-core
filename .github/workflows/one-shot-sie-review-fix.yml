name: One-shot SIE review fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-sie-review-fix.yml

permissions:
  contents: write

jobs:
  prove-runner:
    if: ${{ contains(github.event.head_commit.message, 'diagnose SIE fix runner') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sie-import-review-flow
          fetch-depth: 0
      - name: Prove runner can update the fix branch
        run: |
          mkdir -p .github
          printf 'runner=%s\nsource=%s\n' "${GITHUB_RUN_ID}" "${GITHUB_SHA}" > .github/sie-fix-runner-proof.txt
          git config user.name "Bynex Automation"
          git config user.email "automation@bynex.se"
          git add .github/sie-fix-runner-proof.txt
          git commit -m "ci: prove SIE fix runner"
          git push origin HEAD:fix/sie-import-review-flow
