name: One-shot SIE review fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-sie-review-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, 'arm SIE review fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sie-import-review-flow
          fetch-depth: 0

      - name: Patch SIE review and bookkeeping refresh flow
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          panel_path = Path('components/modules/accounting/SieTransferPanel.tsx')
          panel = panel_path.read_text()

          panel = panel.replace(
              'import { type FormEvent, useState } from "react";',
              'import { type FormEvent, useRef, useState } from "react";',
              1,
          )

          old_props = '''export default function SieTransferPanel({
            notify,
          }: {
            notify: (message: string) => void;
          }) {'''
          new_props = '''export default function SieTransferPanel({
            notify,
            onImportCompleted,
          }: {
            notify: (message: string) => void;
            onImportCompleted?: (result: ImportResult) => void | Promise<void>;
          }) {'''
          if old_props in panel:
              panel = panel.replace(old_props, new_props, 1)

          busy_marker = '  const [busy, setBusy] = useState<BusyState>(null);\n'
          if 'reviewDecisionRef' not in panel:
              if busy_marker not in panel:
                  raise SystemExit('busy state marker not found')
              panel = panel.replace(
                  busy_marker,
                  busy_marker + '  const reviewDecisionRef = useRef<HTMLDivElement | null>(null);\n',
                  1,
              )

          fetch_old = '''    const response = await fetch("/api/private/accounting/sie", {
              method: "POST",
              body,
            });
            const payload = (await response.json().catch(() => null)) as'''
          fetch_new = '''    let response: Response;
            try {
              response = await fetch("/api/private/accounting/sie", {
                method: "POST",
                body,
              });
            } catch {
              setBusy(null);
              setError("SIE-importen kunde inte nå servern. Försök igen – ingen verifikation har bokförts.");
              return;
            }
            const payload = (await response.json().catch(() => null)) as'''
          if fetch_old in panel:
              panel = panel.replace(fetch_old, fetch_new, 1)

          decision_old = '''    const next = payload as Result;
            setResult(next);
            if (intent === "approve") {
              notify(
                next.import?.alreadyImported
                  ? "SIE-filen var redan importerad – ingen dubbelbokföring gjordes"
                  : `${integer.format(next.import?.importedVouchers ?? 0)} SIE-verifikationer är bokförda`,
              );
            } else {
              notify(
                next.review.canApprove
                  ? "SIE-filen är kontrollerad och klar för godkännande"
                  : "SIE-filen är kontrollerad och visar vad som måste lösas",
              );
            }'''
          decision_new = '''    const next = payload as Result;
            setResult(next);
            if (intent === "approve" && next.import) {
              notify(
                next.import.alreadyImported
                  ? "SIE-filen var redan importerad – ingen dubbelbokföring gjordes"
                  : `${integer.format(next.import.importedVouchers)} SIE-verifikationer är bokförda`,
              );
              await onImportCompleted?.(next.import);
            } else {
              notify(
                next.review.canApprove
                  ? "SIE-filen är kontrollerad och klar för godkännande"
                  : "SIE-filen är kontrollerad och visar vad som måste lösas",
              );
              window.requestAnimationFrame(() => {
                reviewDecisionRef.current?.scrollIntoView({
                  behavior: "smooth",
                  block: "center",
                });
              });
            }'''
          if decision_old in panel:
              panel = panel.replace(decision_old, decision_new, 1)

          if 'Steg 2 av 2' not in panel:
              approval_pattern = re.compile(
                  r'\n          \{!result\.import && result\.review\.canApprove && \(\n'
                  r'            <div className="border-t border-zinc-100 bg-emerald-50 p-6">'
                  r'.*?\n          \)\}\n',
                  re.S,
              )
              approval_match = approval_pattern.search(panel)
              if not approval_match:
                  raise SystemExit('approval block not found')
              approval = approval_match.group(0)
              approval = approval.replace(
                  '<div className="border-t border-zinc-100 bg-emerald-50 p-6">',
                  '<div ref={reviewDecisionRef} className="m-6 rounded-2xl border border-emerald-200 bg-emerald-50 p-6">',
                  1,
              )
              approval = approval.replace(
                  'Ett uttryckligt beslut – hela importen i en transaktion',
                  'Steg 2 av 2 · Godkänn importen till bokföringen',
                  1,
              )
              panel = panel[:approval_match.start()] + panel[approval_match.end():]

              summary_pattern = re.compile(
                  r'(\n          <div className="grid gap-px bg-zinc-100 sm:grid-cols-4">'
                  r'.*?<Summary label="Verifikationer" value=\{result\.preview\.voucherCount\} />'
                  r'\n          </div>\n)',
                  re.S,
              )
              summary_match = summary_pattern.search(panel)
              if not summary_match:
                  raise SystemExit('summary block not found')
              panel = panel[:summary_match.end()] + approval + panel[summary_match.end():]

          panel_path.write_text(panel)

          live_path = Path('components/modules/bookkeeping/LiveBookkeepingModule.tsx')
          live = live_path.read_text()
          old_live = '{tab === "sie" && <SieTransferPanel notify={notify} />}'
          new_live = '''{tab === "sie" && (
      <SieTransferPanel
        notify={notify}
        onImportCompleted={async (imported) => {
          await load(imported.fiscalYearId);
          setTab("vouchers");
        }}
      />
    )}'''
          if old_live in live:
              live = live.replace(old_live, new_live, 1)
          live_path.write_text(live)

          test_path = Path('tests/accounting/sie-import-approval.test.mjs')
          tests = test_path.read_text()
          live_read = '''const liveBookkeeping = readFileSync(
            new URL("components/modules/bookkeeping/LiveBookkeepingModule.tsx", root),
            "utf8",
          );
'''
          panel_read_marker = '''const panel = readFileSync(
            new URL("components/modules/accounting/SieTransferPanel.tsx", root),
            "utf8",
          );
'''
          if 'const liveBookkeeping =' not in tests:
              if panel_read_marker not in tests:
                  raise SystemExit('test panel marker not found')
              tests = tests.replace(panel_read_marker, panel_read_marker + live_read, 1)

          if 'SIE-godkännandet visas direkt efter sammanfattningen' not in tests:
              tests += '''

test("SIE-godkännandet visas direkt efter sammanfattningen och bokföringsvyn uppdateras", () => {
  assert.match(panel, /Steg 2 av 2/);
  assert.match(panel, /reviewDecisionRef/);
  assert.match(panel, /scrollIntoView/);
  assert.match(panel, /onImportCompleted/);
  assert.match(panel, /ingen verifikation har bokförts/);
  assert.ok(
    panel.indexOf("Steg 2 av 2") < panel.indexOf("Första verifikationerna"),
    "godkännandeknappen ska visas före den långa verifikationslistan",
  );
  assert.match(liveBookkeeping, /onImportCompleted/);
  assert.match(liveBookkeeping, /await load\(imported\.fiscalYearId\)/);
  assert.match(liveBookkeeping, /setTab\("vouchers"\)/);
});
'''
          test_path.write_text(tests)
          PY

      - name: Run focused checks
        run: |
          npm ci
          npm run test:sie
          npm run typecheck

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Bynex Automation"
          git config user.email "automation@bynex.se"
          git add components/modules/accounting/SieTransferPanel.tsx \
                  components/modules/bookkeeping/LiveBookkeepingModule.tsx \
                  tests/accounting/sie-import-approval.test.mjs
          git commit -m "fix: make SIE approval unmistakable and refresh vouchers"
          git push origin HEAD:fix/sie-import-review-flow
