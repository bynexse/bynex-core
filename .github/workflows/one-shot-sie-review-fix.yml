name: One-shot SIE review fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-sie-review-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, 'arm SIE review fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sie-import-review-flow
          fetch-depth: 0

      - name: Apply direct SIE review-flow edits
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          proof = Path('.github/sie-fix-runner-proof.txt')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise RuntimeError(f'{label}: marker not found')
              return text.replace(old, new, 1)

          try:
              panel_path = Path('components/modules/accounting/SieTransferPanel.tsx')
              panel = panel_path.read_text()

              panel = replace_once(
                  panel,
                  'import { type FormEvent, useState } from "react";',
                  'import { type FormEvent, useRef, useState } from "react";',
                  'react import',
              )

              old_props = "\n".join([
                  'export default function SieTransferPanel({',
                  '  notify,',
                  '}: {',
                  '  notify: (message: string) => void;',
                  '}) {',
              ])
              new_props = "\n".join([
                  'export default function SieTransferPanel({',
                  '  notify,',
                  '  onImportCompleted,',
                  '}: {',
                  '  notify: (message: string) => void;',
                  '  onImportCompleted?: (result: ImportResult) => void | Promise<void>;',
                  '}) {',
              ])
              panel = replace_once(panel, old_props, new_props, 'component props')

              busy = '  const [busy, setBusy] = useState<BusyState>(null);\n'
              panel = replace_once(
                  panel,
                  busy,
                  busy + '  const reviewDecisionRef = useRef<HTMLDivElement | null>(null);\n',
                  'decision ref',
              )

              old_fetch = "\n".join([
                  '    const response = await fetch("/api/private/accounting/sie", {',
                  '      method: "POST",',
                  '      body,',
                  '    });',
              ])
              new_fetch = "\n".join([
                  '    let response: Response;',
                  '    try {',
                  '      response = await fetch("/api/private/accounting/sie", {',
                  '        method: "POST",',
                  '        body,',
                  '      });',
                  '    } catch {',
                  '      setBusy(null);',
                  '      setError(',
                  '        "SIE-importen kunde inte nå servern. Försök igen – ingen verifikation har bokförts.",',
                  '      );',
                  '      return;',
                  '    }',
              ])
              panel = replace_once(panel, old_fetch, new_fetch, 'server fetch')

              old_decision = "\n".join([
                  '    const next = payload as Result;',
                  '    setResult(next);',
                  '    if (intent === "approve") {',
                  '      notify(',
                  '        next.import?.alreadyImported',
                  '          ? "SIE-filen var redan importerad – ingen dubbelbokföring gjordes"',
                  '          : `${integer.format(next.import?.importedVouchers ?? 0)} SIE-verifikationer är bokförda`,',
                  '      );',
                  '    } else {',
                  '      notify(',
                  '        next.review.canApprove',
                  '          ? "SIE-filen är kontrollerad och klar för godkännande"',
                  '          : "SIE-filen är kontrollerad och visar vad som måste lösas",',
                  '      );',
                  '    }',
              ])
              new_decision = "\n".join([
                  '    const next = payload as Result;',
                  '    setResult(next);',
                  '    if (intent === "approve" && next.import) {',
                  '      notify(',
                  '        next.import.alreadyImported',
                  '          ? "SIE-filen var redan importerad – ingen dubbelbokföring gjordes"',
                  '          : `${integer.format(next.import.importedVouchers)} SIE-verifikationer är bokförda`,',
                  '      );',
                  '      await onImportCompleted?.(next.import);',
                  '    } else {',
                  '      notify(',
                  '        next.review.canApprove',
                  '          ? "SIE-filen är kontrollerad och klar för godkännande"',
                  '          : "SIE-filen är kontrollerad och visar vad som måste lösas",',
                  '      );',
                  '      window.requestAnimationFrame(() => {',
                  '        reviewDecisionRef.current?.scrollIntoView({',
                  '          behavior: "smooth",',
                  '          block: "center",',
                  '        });',
                  '      });',
                  '    }',
              ])
              panel = replace_once(panel, old_decision, new_decision, 'post-review decision')

              summary = "\n".join([
                  '          <div className="grid gap-px bg-zinc-100 sm:grid-cols-4">',
                  '            <Summary label="Konton som används" value={result.review.accounts.used} />',
                  '            <Summary label="Matchade konton" value={result.review.accounts.matched} />',
                  '            <Summary label="Nya konton" value={result.review.accounts.willBeCreated.length} />',
                  '            <Summary label="Verifikationer" value={result.preview.voucherCount} />',
                  '          </div>',
              ]) + '\n'
              cta = "\n".join([
                  '',
                  '          {!result.import && result.review.canApprove && (',
                  '            <div',
                  '              ref={reviewDecisionRef}',
                  '              aria-live="polite"',
                  '              className="m-6 rounded-2xl border border-emerald-200 bg-emerald-50 p-6"',
                  '            >',
                  '              <div className="flex flex-col justify-between gap-4 lg:flex-row lg:items-center">',
                  '                <div className="flex items-start gap-3">',
                  '                  <ShieldCheck className="mt-0.5 h-6 w-6 shrink-0 text-emerald-800" />',
                  '                  <div>',
                  '                    <p className="text-xs font-bold uppercase tracking-[0.16em] text-emerald-700">',
                  '                      Steg 2 av 2',
                  '                    </p>',
                  '                    <h4 className="mt-1 text-lg font-semibold text-emerald-950">',
                  '                      Filen är klar – godkänn för att föra in den i bokföringen',
                  '                    </h4>',
                  '                    <p className="mt-2 max-w-3xl text-sm leading-6 text-emerald-900">',
                  '                      Ett klick sparar originalet privat, matchar eller skapar konton och',
                  '                      bokför samtliga balanserade verifikationer i en odelbar transaktion.',
                  '                    </p>',
                  '                  </div>',
                  '                </div>',
                  '                <button',
                  '                  type="button"',
                  '                  onClick={() => void sendFile("approve")}',
                  '                  disabled={Boolean(busy)}',
                  '                  className="inline-flex shrink-0 items-center justify-center gap-2 rounded-xl bg-[#202522] px-6 py-4 text-sm font-semibold text-white shadow-md disabled:opacity-50"',
                  '                >',
                  '                  {busy === "approve" ? (',
                  '                    <Loader2 className="h-4 w-4 animate-spin" />',
                  '                  ) : (',
                  '                    <LockKeyhole className="h-4 w-4 text-emerald-300" />',
                  '                  )}',
                  '                  {busy === "approve"',
                  '                    ? "Importerar säkert…"',
                  '                    : `Godkänn och importera ${integer.format(result.preview.voucherCount)}`}',
                  '                </button>',
                  '              </div>',
                  '            </div>',
                  '          )}',
              ]) + '\n'
              panel = replace_once(panel, summary, summary + cta, 'review call to action')

              live_path = Path('components/modules/bookkeeping/LiveBookkeepingModule.tsx')
              live = live_path.read_text()
              old_live = '    {tab === "sie" && <SieTransferPanel notify={notify} />}'
              new_live = "\n".join([
                  '    {tab === "sie" && (',
                  '      <SieTransferPanel',
                  '        notify={notify}',
                  '        onImportCompleted={async (imported) => {',
                  '          await load(imported.fiscalYearId);',
                  '          setTab("vouchers");',
                  '        }}',
                  '      />',
                  '    )}',
              ])
              live = replace_once(live, old_live, new_live, 'bookkeeping refresh')

              test_path = Path('tests/accounting/sie-import-approval.test.mjs')
              tests = test_path.read_text()
              panel_read = "\n".join([
                  'const panel = readFileSync(',
                  '  new URL("components/modules/accounting/SieTransferPanel.tsx", root),',
                  '  "utf8",',
                  ');',
              ]) + '\n'
              live_read = "\n".join([
                  'const liveBookkeeping = readFileSync(',
                  '  new URL("components/modules/bookkeeping/LiveBookkeepingModule.tsx", root),',
                  '  "utf8",',
                  ');',
              ]) + '\n'
              tests = replace_once(tests, panel_read, panel_read + live_read, 'test module read')

              database_test = 'test("databasmotorn är atomisk, idempotent och återanvänder bokföringsmotorn", () => {'
              new_test = "\n".join([
                  'test("SIE-godkännandet visas direkt och bokföringsvyn uppdateras efter import", () => {',
                  '  assert.match(panel, /Steg 2 av 2/);',
                  '  assert.match(panel, /reviewDecisionRef/);',
                  '  assert.match(panel, /scrollIntoView/);',
                  '  assert.match(panel, /onImportCompleted/);',
                  '  assert.match(panel, /ingen verifikation har bokförts/);',
                  '  assert.ok(',
                  '    panel.indexOf("Steg 2 av 2") < panel.indexOf("Första verifikationerna"),',
                  '    "godkännandeknappen ska visas före den långa verifikationslistan",',
                  '  );',
                  '  assert.match(liveBookkeeping, /onImportCompleted/);',
                  '  assert.match(liveBookkeeping, /await load\\(imported\\.fiscalYearId\\)/);',
                  '  assert.match(liveBookkeeping, /setTab\\("vouchers"\\)/);',
                  '});',
                  '',
              ])
              tests = replace_once(tests, database_test, new_test + database_test, 'SIE UX regression test')

              panel_path.write_text(panel)
              live_path.write_text(live)
              test_path.write_text(tests)
              proof.write_text('patch=applied\n')
          except Exception as exc:
              proof.write_text(f'patch=failed\n{type(exc).__name__}: {exc}\n')
          PY

      - name: Commit branch result
        shell: bash
        run: |
          git config user.name "Bynex Automation"
          git config user.email "automation@bynex.se"
          git add .github/sie-fix-runner-proof.txt \
                  components/modules/accounting/SieTransferPanel.tsx \
                  components/modules/bookkeeping/LiveBookkeepingModule.tsx \
                  tests/accounting/sie-import-approval.test.mjs
          git commit -m "fix: apply direct SIE review-flow edits"
          git push origin HEAD:fix/sie-import-review-flow
