name: One-shot SIE review fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-sie-review-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, 'arm SIE review fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sie-import-review-flow
          fetch-depth: 0

      - name: Recover and apply the reviewed patch with hunk recounting
        shell: bash
        run: |
          git show origin/main^:.github/workflows/one-shot-sie-review-fix.yml > /tmp/patch-source.yml
          python <<'PY'
          from pathlib import Path

          source = Path('/tmp/patch-source.yml').read_text()
          start = "          cat > /tmp/sie-review-flow.patch <<'PATCH'\n"
          end = "\n          PATCH\n"
          if start not in source or end not in source:
              raise SystemExit('patch payload was not found in the previous workflow version')
          raw = source.split(start, 1)[1].split(end, 1)[0]
          patch = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw.splitlines()
          ) + "\n"
          Path('/tmp/sie-review-flow.patch').write_text(patch)
          PY

          if git apply --recount --check /tmp/sie-review-flow.patch > /tmp/sie-apply.log 2>&1; then
            git apply --recount --whitespace=fix /tmp/sie-review-flow.patch
            printf 'patch=applied\nrun=%s\n' "${GITHUB_RUN_ID}" > .github/sie-fix-runner-proof.txt
          else
            {
              printf 'patch=failed\nrun=%s\n\n' "${GITHUB_RUN_ID}"
              cat /tmp/sie-apply.log
            } > .github/sie-fix-runner-proof.txt
          fi

      - name: Commit branch result
        shell: bash
        run: |
          git config user.name "Bynex Automation"
          git config user.email "automation@bynex.se"
          git add .github/sie-fix-runner-proof.txt \
                  components/modules/accounting/SieTransferPanel.tsx \
                  components/modules/bookkeeping/LiveBookkeepingModule.tsx \
                  tests/accounting/sie-import-approval.test.mjs
          git commit -m "fix: apply SIE review-flow result with recount"
          git push origin HEAD:fix/sie-import-review-flow
