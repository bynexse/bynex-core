name: Sync manual time branch with main

on:
  push:
    branches: [agent/manual-time-delivery-notes-v1]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/manual-time-delivery-notes-v1
          fetch-depth: 0
      - name: Merge current main without losing verified feature checks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Feature branch already contains current main."
            exit 0
          fi

          if git merge --no-ff origin/main -m "chore: sync feature branch with main"; then
            git push origin HEAD:agent/manual-time-delivery-notes-v1
            exit 0
          fi

          for path in package.json .github/workflows/bynex-quality.yml; do
            if git diff --name-only --diff-filter=U -- "$path" | grep -q .; then
              git checkout --ours -- "$path"
              git add "$path"
            fi
          done

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "Unexpected merge conflicts remain:"
            echo "$unresolved"
            exit 1
          fi

          git commit -m "chore: sync feature branch with main"
          git push origin HEAD:agent/manual-time-delivery-notes-v1
