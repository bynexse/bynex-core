name: Patch smart menu once

on:
  push:
    branches:
      - agent/smart-menu-business-form-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/smart-menu-business-form-v1

      - name: Consolidate and rename Bynex modules
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/BynexDemo.tsx')
          text = path.read_text(encoding='utf-8')

          old_imports = '''import LiveBookkeepingModule from "@/components/modules/bookkeeping/LiveBookkeepingModule";
import LiveAccountingIntegrationsModule from "@/components/modules/accounting/LiveAccountingIntegrationsModule";
import LiveYearEndModule from "@/components/modules/bookkeeping/LiveYearEndModule";
import LiveSoleTraderModule from "@/components/modules/sole-trader/LiveSoleTraderModule";'''
          new_import = '''import BynexBookkeepingWorkspace from "@/components/modules/bookkeeping/BynexBookkeepingWorkspace";'''
          if old_imports not in text:
              raise SystemExit('Bookkeeping import block not found')
          text = text.replace(old_imports, new_import, 1)

          replacements = {
            '{ id: "dashboard", label: "Översikt", icon: Home },': '{ id: "dashboard", label: "Bynex Start", icon: Home },',
            '{ id: "projects", label: "Projekt", icon: FolderKanban, productModule: "projects" },': '{ id: "projects", label: "Bynex Projekt", icon: FolderKanban, productModule: "projects" },',
            '{ id: "people", label: "Personal & UE", icon: UsersRound, productModule: "time_payroll" },': '{ id: "people", label: "Bynex Personal", icon: UsersRound, productModule: "time_payroll" },',
            '{ id: "foreman", label: "Arbetsledaren", icon: HardHat, productModule: "projects" },': '{ id: "foreman", label: "Bynex Arbetsledning", icon: HardHat, productModule: "projects" },',
            '{ id: "site-manager", label: "Platschef", icon: Building2, productModule: "projects" },': '{ id: "site-manager", label: "Bynex Produktion", icon: Building2, productModule: "projects" },',
            '{ id: "materials", label: "Material & inköp", icon: PackageSearch, productModule: "materials" },': '{ id: "materials", label: "Bynex Material", icon: PackageSearch, productModule: "materials" },',
            '{ id: "assets", label: "Maskiner & tillgångar", icon: Wrench, productModule: "assets" },': '{ id: "assets", label: "Bynex Maskiner", icon: Wrench, productModule: "assets" },',
            '{ id: "change-orders", label: "ÄTA", icon: FileSignature, productModule: "change_orders" },': '{ id: "change-orders", label: "Bynex ÄTA", icon: FileSignature, productModule: "change_orders" },',
            '{ id: "quotes", label: "Offerter", icon: ReceiptText, productModule: "quotes" },': '{ id: "quotes", label: "Bynex Offert", icon: ReceiptText, productModule: "quotes" },',
            '{ id: "invoices", label: "Fakturering", icon: CircleDollarSign, productModule: "invoicing" },': '{ id: "invoices", label: "Bynex Faktura", icon: CircleDollarSign, productModule: "invoicing" },',
            '{ id: "bookkeeping", label: "Bokföring", icon: BookOpenCheck, productModule: "bookkeeping", roles: ["owner", "admin", "office"] },': '{ id: "bookkeeping", label: "Bynex Bokföring", icon: BookOpenCheck, productModule: "bookkeeping", roles: ["owner", "admin", "office"] },',
            '{ id: "property-portal", label: "Kundportal & digital pärm", icon: Building2, productModule: "customer_portal", roles: ["owner", "admin", "office", "manager", "supervisor"] },': '{ id: "property-portal", label: "Bynex Pärmen", icon: Building2, productModule: "customer_portal", roles: ["owner", "admin", "office", "manager", "supervisor"] },',
            '{ id: "settings", label: "Företagsinställningar", icon: Settings },': '{ id: "settings", label: "Bynex Inställningar", icon: Settings },',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Menu row missing: {old}')
              text = text.replace(old, new, 1)

          rows_to_remove = [
            '  { id: "accounting-integrations", label: "Ekonomikopplingar", icon: BookOpenCheck, productModule: "bookkeeping", roles: ["owner", "admin", "office"] },\n',
            '  { id: "year-end", label: "Bokslut", icon: BookOpenCheck, productModule: "bookkeeping", roles: ["owner", "admin", "office"], businessForms: ["sole_trader", "limited_company"] },\n',
            '  { id: "sole-trader", label: "Enskild ekonomi", icon: WalletCards, productModule: "bookkeeping", roles: ["owner", "admin", "office"], businessForms: ["sole_trader"] },\n',
          ]
          for row in rows_to_remove:
              if row not in text:
                  raise SystemExit(f'Legacy bookkeeping row missing: {row}')
              text = text.replace(row, '', 1)

          old_render = '''          {active === "bookkeeping" && <LiveBookkeepingModule notify={notify} />}
          {active === "accounting-integrations" && <LiveAccountingIntegrationsModule notify={notify} />}
          {active === "year-end" && <LiveYearEndModule />}
          {active === "sole-trader" && <LiveSoleTraderModule />}'''
          new_render = '''          {active === "bookkeeping" && (
            <BynexBookkeepingWorkspace
              businessForm={company.businessForm}
              notify={notify}
            />
          )}'''
          if old_render not in text:
              raise SystemExit('Legacy bookkeeping render block missing')
          text = text.replace(old_render, new_render, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit menu integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/BynexDemo.tsx
          git commit -m "feat: launch smart Bynex module menu"
          git push origin HEAD:agent/smart-menu-business-form-v1
