name: Patch Smart estimate syntax once

on:
  push:
    branches:
      - agent/fix-smart-migration-stamp

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-smart-migration-stamp
      - name: Repair assumptions array syntax
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/ai/change-order-estimate.ts')
          text = path.read_text(encoding='utf-8')
          old = '''    ...(history.length > 0
      ? [`Kalkylen använder ${history.length} verifierade företagsutfall för samma arbetskategori.`]
      : ["Företaget saknar ännu verifierade utfall för denna arbetskategori."],
    ...(booleanAnswer(context.answers, "hazardousMaterial")'''
          new = '''    ...(history.length > 0
      ? [`Kalkylen använder ${history.length} verifierade företagsutfall för samma arbetskategori.`]
      : ["Företaget saknar ännu verifierade utfall för denna arbetskategori."]),
    ...(booleanAnswer(context.answers, "hazardousMaterial")'''
          if old not in text:
              raise SystemExit('Expected syntax fragment was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ai/change-order-estimate.ts
          git commit -m "fix: close Smart estimate assumptions expression"
          git push origin HEAD:agent/fix-smart-migration-stamp
