name: Bynex quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "agent/**"]

permissions:
  contents: write

concurrency:
  group: bynex-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Apply final account plan form-state patch
        if: (github.head_ref == 'agent/versioned-searchable-chart-of-accounts' || github.ref_name == 'agent/versioned-searchable-chart-of-accounts') && github.actor != 'github-actions[bot]'
        run: |
          python - <<'PY'
          from pathlib import Path

          panel = Path("components/modules/bookkeeping/AccountPlanCenter.tsx")
          text = panel.read_text(encoding="utf-8")

          old = '''      if (section === "smart" && smartText.trim()) {
        const url = new URL("/api/private/bookkeeping/account-plan", window.location.origin);
        url.searchParams.set("mode", "suggest");
        url.searchParams.set("q", smartText.trim());
        if (supplier.trim()) url.searchParams.set("supplier", supplier.trim());
        if (costType) url.searchParams.set("costType", costType);
        const suggestionResponse = await fetch(url, { cache: "no-store" });
        const suggestionPayload = (await suggestionResponse.json().catch(() => null)) as
          | Payload
          | null;
        if (suggestionResponse.ok && suggestionPayload) {
          setSuggestions(suggestionPayload.results as SuggestionResult[]);
        }
      }
    } catch (caught) {
      setError(
        caught instanceof Error ? caught.message : "Åtgärden kunde inte slutföras.",
      );
    } finally {
'''
          new = '''      if (section === "smart" && smartText.trim()) {
        const url = new URL("/api/private/bookkeeping/account-plan", window.location.origin);
        url.searchParams.set("mode", "suggest");
        url.searchParams.set("q", smartText.trim());
        if (supplier.trim()) url.searchParams.set("supplier", supplier.trim());
        if (costType) url.searchParams.set("costType", costType);
        const suggestionResponse = await fetch(url, { cache: "no-store" });
        const suggestionPayload = (await suggestionResponse.json().catch(() => null)) as
          | Payload
          | null;
        if (suggestionResponse.ok && suggestionPayload) {
          setSuggestions(suggestionPayload.results as SuggestionResult[]);
        }
      }
      return true;
    } catch (caught) {
      setError(
        caught instanceof Error ? caught.message : "Åtgärden kunde inte slutföras.",
      );
      return false;
    } finally {
'''
          if old not in text:
            raise SystemExit("postAction success block did not match")
          text = text.replace(old, new, 1)

          old_custom = '''    await postAction(
      {
        action: "create_custom_account",'''
          new_custom = '''    const succeeded = await postAction(
      {
        action: "create_custom_account",'''
          old_install = '''    await postAction(
      {
        action: "install_catalog",'''
          new_install = '''    const succeeded = await postAction(
      {
        action: "install_catalog",'''
          if old_custom not in text or old_install not in text:
            raise SystemExit("account-plan form calls did not match")
          text = text.replace(old_custom, new_custom, 1)
          text = text.replace(old_install, new_install, 1)
          if text.count("    if (!error) {") < 2:
            raise SystemExit("account-plan reset guards did not match")
          text = text.replace("    if (!error) {", "    if (succeeded) {", 2)
          panel.write_text(text, encoding="utf-8")

          tests = Path("tests/accounting/account-plan-catalog.test.mjs")
          test_text = tests.read_text(encoding="utf-8")
          marker = 'test("account-plan forms only reset after confirmed server success"'
          if marker not in test_text:
            test_text += '''\n\ntest("account-plan forms only reset after confirmed server success", () => {\n  assert.match(panel, /return true;/);\n  assert.match(panel, /return false;/);\n  assert.match(panel, /const succeeded = await postAction/);\n  assert.match(panel, /if \\(succeeded\\)/);\n  assert.doesNotMatch(panel, /if \\(!error\\)/);\n});\n'''
            tests.write_text(test_text, encoding="utf-8")

          temporary = Path(".github/workflows/fix-account-plan-form-state.yml")
          if temporary.exists():
            temporary.unlink()

          canonical = '''name: Bynex quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "agent/**"]

concurrency:
  group: bynex-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify Bynex email branding
        run: npm run test:email
      - name: Verify supplier invoice inbox
        run: npm run test:supplier-inbox
      - name: Verify SIE review and approval
        run: npm run test:sie
      - name: Verify versioned account plan
        run: npm run test:account-plan
      - name: Verify time, diary and delivery notes
        run: npm run test:time-capture
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
'''
          Path(".github/workflows/bynex-quality.yml").write_text(canonical, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/modules/bookkeeping/AccountPlanCenter.tsx tests/accounting/account-plan-catalog.test.mjs .github/workflows/bynex-quality.yml .github/workflows/fix-account-plan-form-state.yml
          git commit -m "fix: reset account plan forms only after success"
          git push origin HEAD:agent/versioned-searchable-chart-of-accounts
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify Bynex email branding
        run: npm run test:email
      - name: Verify supplier invoice inbox
        run: npm run test:supplier-inbox
      - name: Verify SIE review and approval
        run: npm run test:sie
      - name: Verify versioned account plan
        run: npm run test:account-plan
      - name: Verify time, diary and delivery notes
        run: npm run test:time-capture
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
