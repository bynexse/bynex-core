name: Bynex quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "agent/**"]

permissions:
  contents: write

concurrency:
  group: bynex-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-pr68-account-plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 68 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/versioned-searchable-chart-of-accounts'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact internal feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/versioned-searchable-chart-of-accounts
      - name: Patch the account activation callback once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("components/modules/bookkeeping/AccountPlanCenter.tsx")
          text = path.read_text(encoding="utf-8")
          old = '''                  onActivate={() =>
                    result.catalog_account_id
                      ? postAction(
                          {
                            action: "activate_account",
                            catalogAccountId: result.catalog_account_id,
                          },
                          `activate:${result.catalog_account_id}`,
                          `Konto ${result.account_number} är aktiverat`,
                        )
                      : undefined
                  }
'''
          new = '''                  onActivate={() => {
                    if (!result.catalog_account_id) return;
                    void postAction(
                      {
                        action: "activate_account",
                        catalogAccountId: result.catalog_account_id,
                      },
                      `activate:${result.catalog_account_id}`,
                      `Konto ${result.account_number} är aktiverat`,
                    );
                  }}
'''
          if old in text:
            path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
            raise SystemExit("activation callback block did not match")
          PY
      - name: Commit the isolated source fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/modules/bookkeeping/AccountPlanCenter.tsx
          git commit -m "fix: make account activation callback explicitly void"
          git push origin HEAD:agent/versioned-searchable-chart-of-accounts

  verify:
    needs: [fix-pr68-account-plan]
    if: always() && (needs.fix-pr68-account-plan.result == 'success' || needs.fix-pr68-account-plan.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify Bynex email branding
        run: npm run test:email
      - name: Verify supplier invoice inbox
        run: npm run test:supplier-inbox
      - name: Verify SIE review and approval
        run: npm run test:sie
      - name: Verify versioned account plan
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 68
        run: npm run test:account-plan
      - name: Verify time, diary and delivery notes
        run: npm run test:time-capture
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
