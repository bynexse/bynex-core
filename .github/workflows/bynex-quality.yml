name: Bynex quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, "agent/**"]

permissions:
  contents: write

concurrency:
  group: bynex-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.head_ref || github.ref_name }}
      - name: Apply account activation callback patch once
        if: github.event_name == 'pull_request' && github.event.action == 'ready_for_review' && github.head_ref == 'agent/versioned-searchable-chart-of-accounts' && github.actor != 'github-actions[bot]'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("components/modules/bookkeeping/AccountPlanCenter.tsx")
          text = path.read_text(encoding="utf-8")
          old = '''                  onActivate={() =>
                    result.catalog_account_id
                      ? postAction(
                          {
                            action: "activate_account",
                            catalogAccountId: result.catalog_account_id,
                          },
                          `activate:${result.catalog_account_id}`,
                          `Konto ${result.account_number} är aktiverat`,
                        )
                      : undefined
                  }
'''
          new = '''                  onActivate={() => {
                    if (!result.catalog_account_id) return;
                    void postAction(
                      {
                        action: "activate_account",
                        catalogAccountId: result.catalog_account_id,
                      },
                      `activate:${result.catalog_account_id}`,
                      `Konto ${result.account_number} är aktiverat`,
                    );
                  }}
'''
          if old in text:
            path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
            raise SystemExit("activation callback block did not match")
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add components/modules/bookkeeping/AccountPlanCenter.tsx
            git commit -m "fix: make account activation callback explicitly void"
            git push origin HEAD:agent/versioned-searchable-chart-of-accounts
          fi
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify Bynex email branding
        run: npm run test:email
      - name: Verify supplier invoice inbox
        run: npm run test:supplier-inbox
      - name: Verify SIE review and approval
        run: npm run test:sie
      - name: Verify versioned account plan
        run: npm run test:account-plan
      - name: Verify time, diary and delivery notes
        run: npm run test:time-capture
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
