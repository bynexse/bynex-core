name: Bynex quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "agent/**"]

permissions:
  contents: write

concurrency:
  group: bynex-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Repair account plan search indexes once
        if: github.head_ref == 'agent/versioned-searchable-chart-of-accounts' || github.ref_name == 'agent/versioned-searchable-chart-of-accounts'
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("supabase/migrations/20260807215500_versioned_searchable_account_plan.sql")
          text = path.read_text(encoding="utf-8")
          original = text

          text = text.replace(
              "using gin (to_tsvector('simple',search_text));",
              "using gin (to_tsvector('simple'::regconfig,search_text));",
              1,
          )

          old = """create index if not exists ledger_accounts_search_idx
  on public.ledger_accounts
  using gin (
    to_tsvector(
      'simple',
      account_number || ' ' || name || ' '
      || array_to_string(search_aliases,' ')
    )
  );
"""
          new = """create index if not exists ledger_accounts_search_idx
  on public.ledger_accounts
  using gin (
    to_tsvector(
      'simple'::regconfig,
      account_number || ' ' || name
    )
  );
create index if not exists ledger_accounts_search_aliases_idx
  on public.ledger_accounts using gin (search_aliases);
"""
          if old in text:
              text = text.replace(old, new, 1)
          elif "ledger_accounts_search_aliases_idx" not in text:
              raise SystemExit("ledger account search index block did not match")

          if text != original:
              path.write_text(text, encoding="utf-8")

          one_shot = Path(".github/workflows/fix-account-plan-index.yml")
          if one_shot.exists():
              one_shot.unlink()
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add supabase/migrations/20260807215500_versioned_searchable_account_plan.sql .github/workflows/fix-account-plan-index.yml
            git commit -m "fix: use immutable account plan search indexes"
            git push origin HEAD:agent/versioned-searchable-chart-of-accounts
          fi
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Verify Bynex email branding
        run: npm run test:email
      - name: Verify supplier invoice inbox
        run: npm run test:supplier-inbox
      - name: Verify SIE review and approval
        run: npm run test:sie
      - name: Verify versioned account plan
        run: npm run test:account-plan
      - name: Verify time, diary and delivery notes
        run: npm run test:time-capture
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
