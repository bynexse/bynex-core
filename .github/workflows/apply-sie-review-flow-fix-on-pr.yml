name: Apply SIE review-flow fix on PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'fix/sie-import-review-flow' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sie-import-review-flow
          fetch-depth: 0

      - name: Execute reviewed patch script
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-sie-review-flow-fix.yml').read_text()
          marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Run focused checks"
          if marker not in workflow or end_marker not in workflow:
              raise SystemExit('embedded patch script markers not found')
          raw = workflow.split(marker, 1)[1].split(end_marker, 1)[0]
          script = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in raw.splitlines()
          ).lstrip()
          exec(compile(script, 'apply-sie-review-flow-fix.py', 'exec'))
          PY

      - name: Run focused checks
        run: |
          npm ci
          npm run test:sie
          npm run typecheck

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Bynex Automation"
          git config user.email "automation@bynex.se"
          git add components/modules/accounting/SieTransferPanel.tsx \
                  components/modules/bookkeeping/LiveBookkeepingModule.tsx \
                  tests/accounting/sie-import-approval.test.mjs
          if git diff --cached --quiet; then
            echo "Patch already applied"
            exit 0
          fi
          git commit -m "fix: make SIE approval unmistakable and refresh vouchers [sie-review-fix-applied]"
          git push origin HEAD:fix/sie-import-review-flow
